name: Automated AI Newsroom Sync (NewsAPI + Gemini)

on:
  schedule:
    # Runs every 30 minutes automatically to pull fresh breaking stories
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run NewsAPI + Google Gemini In-Depth Synthesis
        run: node scripts/sync_ai_news.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

      - name: Commit and Push new AI Articles and Sitemaps
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/liveAiArticles.json public/sitemap.xml public/sitemap-news.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(news): autonomous sync of breaking stories via NewsAPI and Gemini AI [skip ci]" && git push)
