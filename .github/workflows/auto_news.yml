name: Automated Real-Time News Publisher

on:
  schedule:
    - cron: '*/30 * * * *'  # Har 30 minute baad automated run hoga
  workflow_dispatch:

jobs:
  publish-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # GitHub token ko automatically repo update karne ki ijazat deta hai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run News Bot Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python auto_news_bot.py
