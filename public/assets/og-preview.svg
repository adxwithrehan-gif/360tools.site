<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Central Card -->
  <rect x="100" y="80" width="1000" height="470" rx="28" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Badge -->
  <rect x="160" y="140" width="230" height="40" rx="20" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
  <text x="275" y="165" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    360+ FREE ONLINE TOOLS
  </text>

  <!-- Brand Title -->
  <text x="160" y="250" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    360tools.site
  </text>

  <!-- Subtitle -->
  <text x="160" y="320" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" max-width="800">
    Lightning-Fast, 100% Private Client-Side Browser Utilities
  </text>

  <!-- Feature Pills -->
  <g transform="translate(160, 390)">
    <!-- Pill 1: PDF Tools -->
    <rect x="0" y="0" width="130" height="48" rx="14" fill="#e11d48" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1" />
    <text x="65" y="30" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">PDF Tools</text>

    <!-- Pill 2: Math Solvers -->
    <rect x="145" y="0" width="140" height="48" rx="14" fill="#2563eb" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1" />
    <text x="215" y="30" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Math Solvers</text>

    <!-- Pill 3: Finance Calc -->
    <rect x="300" y="0" width="145" height="48" rx="14" fill="#059669" fill-opacity="0.2" stroke="#34d399" stroke-width="1" />
    <text x="372" y="30" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Finance Calc</text>

    <!-- Pill 4: Developer Tools -->
    <rect x="460" y="0" width="165" height="48" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="542" y="30" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Developer Tools</text>

    <!-- Pill 5: Health & Media -->
    <rect x="640" y="0" width="160" height="48" rx="14" fill="#7c3aed" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1" />
    <text x="720" y="30" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Health &amp; Media</text>
  </g>

  <!-- Footer URL -->
  <text x="160" y="500" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">
