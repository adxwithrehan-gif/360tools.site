  <text x="1040" y="500" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="end">
    https://360tools.site
  </text>
</svg>
