    <script>
      // Compatibility guard: ensure window.fetch can be safely assigned by polyfills, ad networks, or extensions
      // without throwing 'Cannot set property fetch of #<Window> which has only a getter'
      (function() {
        try {
          var target = typeof window !== 'undefined' ? window : typeof globalThis !== 'undefined' ? globalThis : null;
          if (target && 'fetch' in target) {
            var _currentFetch = target.fetch;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return _currentFetch;
                },
                set: function(v) {
                  _currentFetch = v;
                },
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }
        } catch (_) {}
      })();
    </script>
    <script>
      // Single Page Apps for GitHub Pages: Clean deep link rehydration from 404.html redirect
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
