    <script>
      // Defensive shim: Prevent "Cannot set property fetch of #<Window> which has only a getter"
      // Occurs when browser extensions or iframe sandboxes try to write to read-only window.fetch
      (function() {
        try {
          var _origFetch = window.fetch;
          var _fetchImpl = _origFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetchImpl || _origFetch;
            },
            set: function(fn) {
              _fetchImpl = fn;
            }
          });
        } catch (_) {}
      })();

      // Single Page Apps for GitHub Pages: Clean deep link rehydration from 404.html redirect
      (function(l) {
        if (l.search && l.search.charAt(1) === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
          window.history.replaceState(null, null,
              basePath + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <script>
      // Global uncaught error listener to aid debugging and catch extension issues
      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || (e.error && e.error.message))) || '';
        if (typeof msg === 'string' && (msg.indexOf('Cannot set property fetch') !== -1 || (msg.indexOf('fetch') !== -1 && msg.indexOf('getter') !== -1))) {
          if (e.preventDefault) e.preventDefault();
          return;
        }
        console.error('360tools Top-level Runtime Error:', e.error || e.message);
      });

      // Aggressive stale cache purger: ensure users are never trapped by outdated service worker caches
      (function() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].update();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var j = 0; j < keys.length; j++) {
                if (keys[j] === '360tools-cache-v1' || keys[j] === '360tools-cache-v2') {
                  caches.delete(keys[j]);
                }
              }
            });
          }
        } catch (_) {}
      })();
